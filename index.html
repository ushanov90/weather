<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Погода в Ёнском</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#fff;font-family:monospace;}
  pre{padding:20px;font-size:14px;white-space:pre;}
</style>
</head>
<body>

<pre id="view">Загрузка трехдневного прогноза...</pre>

<script>
  // Ссылка разбита на мелкие куски, чтобы не уходить за экран:
  var ч1 = "https://io.";
  var ч2 = "wttr.in/";
  var шир = "67.58";
  var дол = "31.15";
  var хвост = "?lang=ru&M";

  var url = ч1 + ч2 + шир + "," + дол + хвост;

  fetch(url)
    .then(r => r.text())
    .then(data => {
      document.getElementById('view').innerHTML = data;
    });
</script>

</body>
</html>
