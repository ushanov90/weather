<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Погода в Ёнском</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#fff;font-family:monospace;}
  pre{padding:20px;font-size:14px;white-space:pre;line-height:1.2;}
</style>
</head>
<body>

<pre id="view">Загрузка прогноза на 3 дня...</pre>

<script>
  // Ваша точная ссылка разбита по строчкам:
  var ч1 = "https://";
  var ч2 = "wttr.in/";
  var ч3 = "~67.58";
  var ч4 = "%20";
  var ч5 = "31.15";
  var ч6 = "?lang=ru&M";

  var fullUrl = ч1 + ч2 + ч3 + ч4 + ч5 + ч6;

  // Безопасный запрос без блокировок:
  fetch(fullUrl, { mode: 'cors' })
    .then(function(r) { return r.text(); })
    .then(function(data) {
      // Убираем HTML-теги, оставляем только чистый 3-дневный текст
      var clean = data.replace(/<\/?[^>]+(>|$)/g, "");
      document.getElementById('view').innerText = clean;
    })
    .catch(function() {
      document.getElementById('view').innerText = 'Ошибка сети.';
    });

  // Авто-обновление раз в 3 часа
  setTimeout(function(){ location.reload(); }, 10800000);
</script>

</body>
</html>
