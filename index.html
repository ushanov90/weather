<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Погода в Ёнском</title>
<style>
  html,body{margin:0;padding:0;background:#000;text-align:center;}
  img{max-width:100%;height:auto;padding-top:20px;}
</style>
</head>
<body>

<img src="https://wttr.in"
     alt="67.58,31.15"
     src2="?lang=ru&M_3.png">

<script>
  // Этот скрипт сам соберет короткие строчки в одну картинку:
  var Картинка = document.getElementsByTagName('img')[0];
  Картинка.src = Картинка.getAttribute('src') 
               + Картинка.getAttribute('alt') 
               + Картинка.getAttribute('src2');
</script>

</body>
</html>
