<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Погода в Ёнском</title>
<style>
  html,body{margin:0;padding:0;background:#000;text-align:center;}
  img{max-width:100%;height:auto;padding-top:20px;}
</style>
</head>
<body>

<img id="pogoda">

<script>
  // Координаты Ёнского разбиты на супер-короткие части:
  var ч1 = "https://";
  var ч2 = "wttr.in/";
  var шир = "67.58";
  var дол = "31.15";
  var хвост = "_3m.png?lang=ru";

  // Скрипт собирает их вместе без ошибок
  var pic = document.getElementById('pogoda');
  pic.src = ч1 + ч2 + шир + "," + дол + хвост;
</script>

</body>
</html>
