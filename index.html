<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Погода в Ёнском</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
  iframe{width:100%;height:100%;border:none;}
</style>
</head>
<body>

<iframe id="okno"></iframe>

<script>
  // Ваша точная ссылка, разбитая на короткие части:
  var ч1 = "https://wttr.in";
  var ч2 = "~67.58";
  var ч3 = "%20";
  var ч4 = "31.15";
  var ч5 = "?lang=ru&M";

  // Скрипт соединяет куски и запускает сайт
  document.getElementById("okno").src = ч1 + ч2 + ч3 + ч4 + ч5;

  // Автоматическое обновление раз в 3 часа
  setTimeout(function(){ location.reload(); }, 10800000);
</script>

</body>
</html>
