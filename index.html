<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Погода в Ёнском</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#fff;font-family:monospace;}
  pre{padding:20px;font-size:14px;white-space:pre;line-height:1.2;}
</style>
</head>
<body>

<pre id="view">Загрузка 3 дней прогноза...</pre>

<script>
  var ч1 = "https://allorigins.win";
  var ч2 = "https://wttr.in";
  var шир = "67.58";
  var дол = "31.15";
  var хв = "?lang=ru%26M"; // %26 это знак & для прокси

  var target = ч2 + шир + "," + dол + хв;
  var url = ч1 + encodeURIComponent(target);

  fetch(url)
    .then(r => r.json())
    .then(data => {
      document.getElementById('view').innerHTML = data.contents;
    })
    .catch(() => {
      document.getElementById('view').innerText = 'Ошибка сети.';
    });

  // Обновление страницы раз в 3 часа
  setTimeout(function(){ location.reload(); }, 10800000);
</script>

</body>
</html>
